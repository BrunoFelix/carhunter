spring.application.name=carhunter

# Server
server.port=9006
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/databaseCarhunter
spring.datasource.username=usernameCarhunter
spring.datasource.password=passwordCarhunter
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update

# Clients
olx.client.url=https://www.olx.com.br/_next/data/${olx.client.token}/pt-BR/autos-e-pecas/carros-vans-e-utilitarios/estado-pe.json
olx.client.token=${OLX_TOKEN:1}

autoparvi.client.url=https://www.autoparvi.com.br/ajax/seminovos

via1.client.url=https://api.autodromo.app/v1/groups/1455/used_models
via1.client.token=${VIA1_TOKEN:1}

autoline.client.url=https://api2.autoline.com.br/api/adsearch/adsearchcars

webmotors.client.url=https://www.webmotors.com.br/api/search/car

# Scheduler
search.cron=0 0 9,12,15,18 * * *

